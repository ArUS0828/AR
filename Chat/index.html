<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>just us</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- LOCK SCREEN -->
<section id="lockScreen" class="screen d-flex align-items-center justify-content-center" style="background-image: url(https://themesdesign.in/loxcy/layout/images/bg-banner.png);
    background-position: center;
    background-repeat: no-repeat;">
    <div class="svg-img">
            <img src="https://themesdesign.in/loxcy/layout/images/three-l.svg" alt="" class="img-fluid" style="    position: absolute;
    width: 6%;
    top: 13%;
    left: 18%;">
        </div>
 <div class="svg-img-2">
            <img src="https://themesdesign.in/loxcy/layout/images/arrow.svg" alt="" class="img-fluid" style="  position: absolute;
    width: 15%;
    top: 65%;
    left: 65%;
    animation: up-down-img 1.7s ease-in-out infinite alternate both;
    animation-delay: -0.1s;">
        </div>
  <div class="lock-card">
    <div class="lock-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M6 10V8a6 6 0 1112 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="4" y="10" width="16" height="11" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="12" cy="15.5" r="1.6" fill="currentColor"/>
      </svg>
    </div>
    <h1 class="lock-title">Just us</h1>
    <p class="lock-sub">Enter the passphrase to come in</p>
    <input type="password" id="lockPassword" class="lock-input" placeholder="Passphrase" autocomplete="off">
    <div id="lockDots" class="lock-dots"></div>
    <button id="lockSubmit" class="lock-btn">Unlock</button>
    <p id="lockError" class="lock-error"></p>
  </div>
</section>

<!-- USER SELECT / LOGIN SCREEN -->
<section id="loginScreen" class="screen d-flex align-items-center justify-content-center d-none">

  <div class="lock-card">
    <h1 class="lock-title">Who's this?</h1>
    <p class="lock-sub">Pick yourself and sign in</p>

    <div class="user-toggle" role="group">
      <button type="button" class="user-btn active" data-user="User1">User 1</button>
      <button type="button" class="user-btn" data-user="User2">User 2</button>
    </div>

    <input type="text" id="usernameField" class="lock-input" value="User1" readonly>
    <input type="password" id="userPassword" class="lock-input" placeholder="Your password" autocomplete="off">
    <button id="loginSubmit" class="lock-btn">Sign in</button>
    <p id="loginError" class="lock-error"></p>
  </div>
</section>

<!-- CHAT SCREEN -->
<section id="chatScreen" class="screen d-none">
  <header class="chat-header d-flex align-items-center justify-content-between px-3">
    <div class="d-flex align-items-center gap-3">
      <div class="avatar">
        <span id="otherInitial">AR</span>
        <span class="avatar-dot" id="statusDot"></span>
      </div>
      <div class="d-flex flex-column">
        <span class="chat-title">just us</span>
        <span class="last-seen" id="lastSeenLabel"></span>
      </div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="me-label" id="meLabel"></span>
      <button id="settingsBtn" class="logout-btn" title="Change password">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.04 1.56V21a2 2 0 11-4 0v-.09A1.7 1.7 0 009 19.35a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.65 15a1.7 1.7 0 00-1.56-1.04H3a2 2 0 110-4h.09A1.7 1.7 0 004.65 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.65a1.7 1.7 0 001.04-1.56V3a2 2 0 114 0v.09A1.7 1.7 0 0015 4.65a1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.35 9a1.7 1.7 0 001.56 1.04H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.51 1.96z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="logoutBtn" class="logout-btn" title="Log out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 01-2-2V7a2 2 0 012-2h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="messageList" class="message-list px-2 px-md-4"></main>

  <form id="composerForm" class="composer d-flex align-items-center gap-2 px-2 px-md-4">
    <input type="text" id="messageInput" class="composer-input" placeholder="type something..." autocomplete="off">
    <button type="submit" class="send-btn" id="sendBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M4 20l16-8L4 4v6l11 2-11 2v6z" fill="currentColor"/>
      </svg>
    </button>
  </form>
</section>

<!-- CHANGE PASSWORD MODAL -->
<div id="passwordModal" class="modal-overlay d-none d-flex align-items-center justify-content-center">
  <div class="modal-card">
    <h2 class="lock-title modal-title">Change password</h2>
    <input type="password" id="oldPasswordField" class="lock-input" placeholder="Current password" autocomplete="off">
    <input type="password" id="newPasswordField" class="lock-input" placeholder="New password" autocomplete="off">
    <button id="savePasswordBtn" class="lock-btn">Save</button>
    <button id="cancelPasswordBtn" class="lock-btn-secondary">Cancel</button>
    <p id="passwordError" class="lock-error"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
